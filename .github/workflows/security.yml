name: Security Scan

on:
  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run security checks
        run: |
          ./scripts/security/check-all.sh